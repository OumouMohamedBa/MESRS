<!-- Page de connexion moderne avec animation -->
<div
  class="fixed inset-0 z-50 bg-white/95 backdrop-blur-sm flex items-center justify-center p-6"
  [attr.dir]="langue === 'ar' ? 'rtl' : 'ltr'"
>
  <div
    class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 p-8 transform transition-all duration-700 ease-out animate-fade-slide"
  >
    <!-- Logo animé -->
    <div class="flex justify-center mb-6 animate-fade-in">
      <img
        src="assets/images/logo-removebg-preview.png"
        alt="Logo MESRS"
        class="h-40 w-40"
      />
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 animate-fade-up">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          {{ langue === 'ar' ? 'اسم المستخدم' : 'Utilisateur' }}
        </label>
        <input
          type="text"
          formControlName="username"
          [placeholder]="langue === 'ar' ? 'اكتب اسم المستخدم' : 'Entrez votre identifiant'"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600 transition"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          {{ langue === 'ar' ? 'كلمة المرور' : 'Mot de passe' }}
        </label>
        <input
          type="password"
          formControlName="password"
          [placeholder]="langue === 'ar' ? 'اكتب كلمة المرور' : 'Entrez votre mot de passe'"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600 transition"
        />
      </div>

      <button
        type="submit"
        [disabled]="submitting || form.invalid"
        class="w-full bg-green-700 text-white rounded-lg py-3 font-semibold hover:bg-green-800 disabled:opacity-60 disabled:cursor-not-allowed transition"
      >
        {{
          submitting
            ? (langue === 'ar' ? '...جارٍ تسجيل الدخول' : 'Connexion...')
            : (langue === 'ar' ? 'تسجيل الدخول' : 'Se connecter')
        }}
      </button>

      <a
        routerLink="/"
        class="block text-center text-sm text-gray-600 hover:underline mt-2"
      >
        {{ langue === 'ar' ? 'رجوع' : 'Retour' }}
      </a>
    </form>
  </div>
</div>
