<header
  class="fixed top-4 right-4 left-[288px] z-50 bg-white/90 backdrop-blur-md border border-gray-200 shadow-lg rounded-2xl transition-all duration-300">

  <div class="mx-auto px-5 h-16 flex items-center justify-between">

    <!-- 🟢 Titre + icône -->
    <div class="flex items-center gap-3 min-w-[240px]">
      <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-green-50 shadow-inner">
        <i class="fa-solid fa-layer-group text-green-700 text-lg"></i>
      </div>
      <h1 class="text-lg font-semibold text-gray-900 tracking-tight truncate">
        {{ title }}
      </h1>
    </div>

    <!-- 🧩 Actions -->
    <div class="flex items-center gap-4 ml-auto">

      <!-- 🌍 Langue -->
      <div class="relative group">
        <button
          class="inline-flex items-center gap-2 text-sm px-3 py-2 rounded-full border border-gray-200 bg-white shadow-sm hover:shadow-md hover:bg-gray-50 transition-all duration-200">
          <i class="fa-solid fa-globe text-green-700"></i>
          <span class="font-medium">{{ langue | uppercase }}</span>
          <i class="fa-solid fa-chevron-down text-gray-400 text-xs"></i>
        </button>
        <div
          class="hidden group-hover:block absolute right-0 mt-2 w-28 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-10 animate-fade-in">
          <button class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50" (click)="setLang('fr')">Français</button>
          <button class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50" (click)="setLang('ar')">العربية</button>

        </div>
      </div>

      <!-- 🔔 Notifications -->
      <button class="relative p-2.5 rounded-xl hover:bg-gray-100 shadow-sm transition">
        <i class="fa-regular fa-bell text-gray-700 text-lg"></i>
        <span
          class="absolute -top-0.5 -right-0.5 bg-red-600 text-white text-[10px] leading-3 px-1.5 rounded-full shadow-sm">
          3
        </span>
      </button>

      <!-- 🌙 Mode sombre -->
      <button class="p-2.5 rounded-xl hover:bg-gray-100 shadow-sm transition" (click)="onToggleDark()">
        <i class="fa-regular fa-moon text-gray-700 text-lg"></i>
      </button>

      <!-- 👤 Profil -->
      <div class="relative group">
        <button
          class="inline-flex items-center gap-2 px-3 py-2 rounded-full border border-gray-200 bg-white shadow-sm hover:shadow-md transition-all duration-200">
          <span
            class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-green-700 text-white text-xs font-semibold">
            IN
          </span>
          <span class="hidden sm:block text-sm font-medium text-gray-800">Inspecteur</span>
          <i class="fa-solid fa-chevron-down text-gray-400 text-xs"></i>
        </button>
        <div
          class="hidden group-hover:block absolute right-0 mt-2 w-44 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-10 animate-fade-in">
          <a routerLink="/profile" class="block px-3 py-2 text-sm hover:bg-gray-50">Profil</a>
          <button class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50">Déconnexion</button>
        </div>
      </div>
    </div>
  </div>
</header>
