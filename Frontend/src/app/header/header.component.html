<header
  class="fixed top-4 right-4 left-4 lg:left-[288px] z-50
         bg-white/95 backdrop-blur-xl border border-emerald-100/50 
         shadow-[0_8px_30px_-5px_rgba(16,185,129,0.15)]
         rounded-2xl transition-all duration-300
         hover:shadow-[0_12px_40px_-5px_rgba(16,185,129,0.2)]"
>
  <!-- Gradient top border -->
  <div class="absolute top-0 left-0 right-0 h-0.5 bg-gradient-to-r from-transparent via-emerald-500 to-transparent rounded-t-2xl"></div>
  
  <div class="mx-auto px-4 sm:px-5 h-16 flex items-center justify-between gap-4">

    <!-- 🟢 Bouton menu pour mobile avec animation -->
    <button
      class="lg:hidden p-2.5 rounded-xl border border-emerald-200/70 bg-gradient-to-br from-white to-emerald-50/30
             shadow-md hover:shadow-lg transition-all duration-300 hover:scale-105 active:scale-95
             group"
      (click)="toggleSidebar.emit()"
      aria-label="Ouvrir le menu"
    >
      <i class="fa-solid fa-bars text-emerald-700 text-lg group-hover:rotate-90 transition-transform duration-300"></i>
    </button>

    <!-- 🟢 Titre + icône avec animations -->
    <div class="flex items-center gap-3 min-w-[180px] sm:min-w-[240px] overflow-hidden">
      <div
        class="relative flex items-center justify-center w-11 h-11 rounded-xl
               bg-gradient-to-br from-emerald-500 to-teal-500
               shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-110
               group overflow-hidden"
      >
        <!-- Shimmer effect -->
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent 
                    translate-x-[-200%] group-hover:translate-x-[200%] transition-transform duration-700"></div>
        <i class="fa-solid fa-layer-group text-white text-lg relative z-10"></i>
      </div>
      <div class="flex flex-col">
        <h1 class="text-sm sm:text-base md:text-lg font-bold bg-gradient-to-r from-emerald-700 to-teal-600 
                   bg-clip-text text-transparent tracking-tight truncate">
          {{ title }}
        </h1>
        <span class="hidden sm:inline text-xs text-gray-500 font-medium">
          Inspection interne • MESRS
        </span>
      </div>
    </div>

    <!-- 🧩 Actions -->
    <div class="flex items-center gap-2 sm:gap-3 ml-auto">

      <!-- 🌍 Langue (menu au clic) -->
      <div class="relative lang-menu">
        <button
          class="group inline-flex items-center gap-2 text-xs sm:text-sm px-3 py-2 rounded-xl
                 border border-emerald-200 bg-gradient-to-br from-white to-emerald-50/30 shadow-md
                 hover:shadow-lg hover:scale-105 active:scale-95 transition-all duration-300"
          (click)="toggleLangMenu($event)"
        >
          <i class="fa-solid fa-globe text-emerald-600 text-sm group-hover:rotate-12 transition-transform duration-300"></i>
          <span class="font-bold text-emerald-700">{{ langue | uppercase }}</span>
          <i class="fa-solid fa-chevron-down text-emerald-500 text-[10px] group-hover:translate-y-0.5 transition-transform duration-300"></i>
        </button>

        <div
          *ngIf="isLangOpen"
          class="absolute right-0 mt-2 w-32 bg-white/95 backdrop-blur-xl
                 border border-emerald-100 rounded-xl shadow-2xl py-2 z-10
                 animate-fadeIn"
        >
          <button
            class="w-full text-left px-4 py-2.5 text-xs sm:text-sm font-medium text-gray-700
                   hover:bg-gradient-to-r hover:from-emerald-50 hover:to-teal-50 hover:text-emerald-700
                   transition-all duration-200 flex items-center gap-2"
            (click)="onSelectLang('fr')"
          >
            <span class="text-base">🇫🇷</span>
            Français
          </button>
          <button
            class="w-full text-left px-4 py-2.5 text-xs sm:text-sm font-medium text-gray-700
                   hover:bg-gradient-to-r hover:from-emerald-50 hover:to-teal-50 hover:text-emerald-700
                   transition-all duration-200 flex items-center gap-2"
            (click)="onSelectLang('ar')"
          >
            <span class="text-base">🇸🇦</span>
            العربية
          </button>
          <button
            class="w-full text-left px-4 py-2.5 text-xs sm:text-sm font-medium text-gray-700
                   hover:bg-gradient-to-r hover:from-emerald-50 hover:to-teal-50 hover:text-emerald-700
                   transition-all duration-200 flex items-center gap-2"
            (click)="onSelectLang('en')"
          >
            <span class="text-base">🇬🇧</span>
            English
          </button>
        </div>
      </div>

      <!-- 🔔 Notifications -->
      <button
        class="group relative p-2.5 rounded-xl border border-emerald-200/70
               bg-gradient-to-br from-white to-emerald-50/30
               shadow-md hover:shadow-lg transition-all duration-300
               hover:scale-105 active:scale-95"
        (click)="onOpenNotifications()"
      >
        <i class="fa-regular fa-bell text-emerald-700 text-base sm:text-lg
                  group-hover:animate-bounce"></i>
        <span
          class="absolute -top-0.5 -right-0.5 bg-gradient-to-r from-red-500 to-pink-500 
                 text-white text-[10px] font-bold leading-3 px-1.5 rounded-full 
                 shadow-lg animate-pulse"
        >
          3
        </span>
      </button>

      <!-- 🌙 Mode sombre -->
      <button
        class="group p-2.5 rounded-xl border border-emerald-200/70
               bg-gradient-to-br from-white to-emerald-50/30
               shadow-md hover:shadow-lg transition-all duration-300
               hover:scale-105 active:scale-95"
        (click)="onToggleDark()"
      >
        <i class="fa-regular fa-moon text-emerald-700 text-base sm:text-lg
                  group-hover:rotate-12 transition-transform duration-300"></i>
      </button>

      <!-- 👤 Profil (menu au clic) -->
      <div class="relative profile-menu">
        <button
          class="group inline-flex items-center gap-2 px-3 py-2 rounded-xl border border-emerald-200
                 bg-gradient-to-br from-white to-emerald-50/30 shadow-md hover:shadow-lg 
                 transition-all duration-300 hover:scale-105 active:scale-95"
          (click)="toggleProfileMenu($event)"
        >
          <!-- Avatar avec initiales ou photo -->
          <span
            class="inline-flex h-8 w-8 items-center justify-center rounded-full
                   bg-gradient-to-br from-emerald-600 to-teal-600 text-white text-xs font-bold
                   shadow-md group-hover:shadow-lg transition-shadow duration-300"
          >
            {{ getUserInitials() }}
          </span>
          <!-- Nom de l'utilisateur -->
          <span class="hidden sm:block text-xs sm:text-sm font-bold text-emerald-700">
            {{ getUserDisplayName() }}
          </span>
          <i class="fa-solid fa-chevron-down text-emerald-500 text-[10px] 
                    group-hover:translate-y-0.5 transition-transform duration-300"></i>
        </button>

        <div
          *ngIf="isProfileOpen"
          class="absolute right-0 mt-2 w-48 bg-white/95 backdrop-blur-xl border border-emerald-100
                 rounded-xl shadow-2xl py-2 z-10 animate-fadeIn"
        >
          <!-- En-tête du menu avec info utilisateur -->
          <div class="px-4 py-3 border-b border-gray-100">
            <p class="text-xs text-gray-500">Connecté en tant que</p>
            <p class="text-sm font-bold text-gray-900">{{ getUserDisplayName() }}</p>
          </div>
          
          <button
            class="w-full flex items-center gap-3 text-left px-4 py-2.5 text-xs sm:text-sm font-medium text-gray-700
                   hover:bg-gradient-to-r hover:from-red-50 hover:to-pink-50 hover:text-red-600
                   transition-all duration-200"
            (click)="onLogout()"
          >
            <i class="fa-solid fa-right-from-bracket text-red-500"></i>
            Déconnexion
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
