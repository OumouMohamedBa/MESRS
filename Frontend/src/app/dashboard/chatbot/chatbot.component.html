<!-- Chatbot Widget -->
<div class="fixed bottom-6 right-6 z-40 font-inter">
  <!-- Bouton de toggle -->
  <button 
    (click)="toggleChat()" 
    class="relative w-12 h-12 rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 border-none text-white text-lg cursor-pointer shadow-xl hover:shadow-2xl transition-all duration-300 flex items-center justify-center hover:scale-110"
    [style.transform]="isOpen ? 'rotate(180deg)' : 'rotate(0deg)'"
  >
    <i class="fa-solid fa-comments"></i>
    <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold animate-pulse" 
          *ngIf="!isOpen && messages.length === 1">Nouveau</span>
  </button>

  <!-- Fenêtre de chat -->
  <div *ngIf="isOpen" 
       class="absolute bottom-16 right-0 w-96 max-h-[70vh] bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-emerald-100">
    <!-- En-tête -->
    <div class="bg-gradient-to-r from-emerald-500 to-emerald-600 text-white p-4 flex justify-between items-center rounded-t-3xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-robot text-lg"></i>
        </div>
        <div>
          <h3 class="m-0 text-sm font-semibold">Assistant MESRS</h3>
          <span class="text-xs opacity-90 flex items-center gap-1">
            <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
            En ligne
          </span>
        </div>
      </div>
      <button (click)="toggleChat()" 
              class="bg-white/20 border-none text-white w-7 h-7 rounded-lg cursor-pointer flex items-center justify-center transition-all hover:bg-white/30 hover:scale-110">
        <i class="fa-solid fa-times text-sm"></i>
      </button>
    </div>

    <!-- Messages -->
    <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 max-h-[400px]">
      <div 
        *ngFor="let message of messages" 
        class="flex flex-col max-w-[80%] animate-fadeIn"
        [class.self-end]="message.type === 'user'"
        [class.self-start]="message.type === 'bot'"
      >
        <div class="p-3 rounded-2xl shadow-sm"
             [class.bg-gradient-to-r]="message.type === 'user'"
             [class.from-emerald-500]="message.type === 'user'"
             [class.to-emerald-600]="message.type === 'user'"
             [class.text-white]="message.type === 'user'"
             [class.bg-gray-50]="message.type === 'bot'"
             [class.border]="message.type === 'bot'"
             [class.border-gray-100]="message.type === 'bot'"
             [class.rounded-br-lg]="message.type === 'user'"
             [class.rounded-bl-lg]="message.type === 'bot'">
          <div class="text-sm leading-relaxed" [innerHTML]="formatMessage(message.content)"></div>
          
          <!-- Actions pour les rapports -->
          <div *ngIf="message.type === 'bot' && message.data && message.data.resume" class="mt-3">
            <button (click)="downloadReport(message.data)" 
                    class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs cursor-pointer flex items-center gap-1.5 transition-all shadow-sm hover:shadow-md">
              <i class="fa-solid fa-download text-xs"></i>
              Télécharger le rapport
            </button>
          </div>
          
          <!-- Statistiques détaillées -->
          <div *ngIf="message.type === 'bot' && message.data && !message.data.resume" 
               class="mt-3 pt-3 border-t border-gray-100">
            <div *ngIf="message.data.parType" class="mb-2">
              <strong class="text-xs text-gray-600 font-medium">Par type:</strong>
              <div class="flex flex-wrap gap-1.5 mt-1">
                <span *ngFor="let entry of message.data.parType | keyvalue" 
                      class="bg-emerald-50 text-emerald-700 px-2 py-1 rounded-full text-xs border border-emerald-100 font-medium">
                  {{entry.key}}: {{entry.value}}
                </span>
              </div>
            </div>
            <div *ngIf="message.data.parStatut" class="mb-2">
              <strong class="text-xs text-gray-600 font-medium">Par statut:</strong>
              <div class="flex flex-wrap gap-1.5 mt-1">
                <span *ngFor="let entry of message.data.parStatut | keyvalue" 
                      class="bg-emerald-50 text-emerald-700 px-2 py-1 rounded-full text-xs border border-emerald-100 font-medium">
                  {{entry.key}}: {{entry.value}}
                </span>
              </div>
            </div>
          </div>
        </div>
        
        <div class="text-xs text-gray-400 mt-1"
             [class.self-end]="message.type === 'user'"
             [class.self-start]="message.type === 'bot'">
          {{message.timestamp | date:'HH:mm'}}
        </div>
      </div>

      <!-- Indicateur de chargement -->
      <div *ngIf="isLoading" class="flex flex-col max-w-[80%] self-start">
        <div class="bg-gray-50 p-3 rounded-2xl rounded-bl-lg border border-gray-100">
          <div class="flex items-center gap-2 py-2">
            <div class="flex gap-1">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-bounce"></span>
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-bounce" style="animation-delay: 0.1s"></span>
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-bounce" style="animation-delay: 0.2s"></span>
            </div>
            <span class="text-xs text-gray-500 ml-2">En cours...</span>
            <button (click)="cancelRequest()" 
                    class="ml-auto text-xs text-red-500 hover:text-red-700 font-medium transition-colors">
              Annuler
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Zone de saisie -->
    <div class="p-4 border-t border-gray-100 bg-gradient-to-b from-emerald-50/30 to-white rounded-b-3xl">
      <div class="flex gap-2 items-center">
        <input 
          type="text" 
          [(ngModel)]="currentMessage"
          (keypress)="onKeyPress($event)"
          placeholder="Posez votre question..."
          class="flex-1 px-4 py-2.5 border border-gray-200 rounded-2xl text-sm outline-none transition-all focus:border-emerald-400 focus:shadow-sm disabled:opacity-50 disabled:cursor-not-allowed bg-white"
          [disabled]="isLoading"
        />
        <button 
          (click)="sendMessage()" 
          class="w-9 h-9 rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 border-none text-white cursor-pointer flex items-center justify-center transition-all hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg"
          [disabled]="!currentMessage.trim() || isLoading"
        >
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </div>
      
      <!-- Suggestions rapides -->
      <div class="flex flex-wrap gap-1.5 mt-3">
        <button 
          *ngFor="let suggestion of quickSuggestions"
          (click)="currentMessage = suggestion; sendMessage()"
          class="bg-white border border-emerald-200 text-emerald-700 px-3 py-1 rounded-full text-xs cursor-pointer transition-all whitespace-nowrap hover:bg-emerald-50 hover:border-emerald-300 hover:shadow-sm disabled:opacity-50 disabled:cursor-not-allowed font-medium"
          [disabled]="isLoading"
        >
          {{suggestion}}
        </button>
      </div>
      
      <!-- Message d'aide pendant le chargement -->
      <div *ngIf="isLoading" class="mt-2 text-xs text-gray-400 text-center">
        💡 Vous pouvez annuler la question en cours avec le bouton "Annuler"
      </div>
    </div>
  </div>
</div>

<style>
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fadeIn {
  animation: fadeIn 0.3s ease-out;
}
</style>
