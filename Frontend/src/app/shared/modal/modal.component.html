<div class="modal-backdrop" [class.modal-backdrop--transparent]="!backdrop" (click)="onBackdropClick($event)">
  <ng-container *ngIf="plain; else defaultModal">
    <ng-content></ng-content>
  </ng-container>

  <ng-template #defaultModal>
    <div class="modal-container">
      <div class="modal-header">
        <button class="close-btn" (click)="onClose()" aria-label="Fermer">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="modal-content">
        <ng-content></ng-content>
      </div>
    </div>
  </ng-template>
</div>
