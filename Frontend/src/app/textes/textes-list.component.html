<app-sidebar></app-sidebar>
<app-header [title]="'Textes Réglementaires'" [withSidebar]="true"></app-header>

<!-- Espace sous le header -->
<div class="lg:ml-80 pt-28 px-6 pb-30 lg:mt-8">
  <div
    class="bg-white border border-gray-200 rounded-2xl shadow-lg overflow-hidden transition-all duration-300">

    <!-- 🔹 Barre d’en-tête avec bouton d’ajout -->
    <div
      class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 p-5 border-b border-gray-100 bg-white/70 backdrop-blur-sm">
      
      <!-- 🔍 Recherche + Filtres -->
      <div class="flex flex-col md:flex-row gap-3 md:items-center w-full md:w-auto flex-wrap">
        <label class="relative md:w-72 w-full">
          <i class="fa-solid fa-magnifying-glass text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input
            type="search"
            placeholder="Rechercher par titre / réf."
            (input)="onQueryInput($any($event.target).value)"
            class="w-full bg-gray-50 border border-gray-200 rounded-full pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-600 transition" />
        </label>

        <select
          class="bg-white border border-gray-200 rounded-full px-3 py-2 text-sm focus:ring-2 focus:ring-green-600"
          (change)="onStatutChange($any($event.target).value)">
          <option value="">Statut: Tous</option>
          <option>En vigueur</option>
          <option>Abrogé</option>
          <option>Projet</option>
        </select>

        <input
          type="date"
          class="bg-white border border-gray-200 rounded-full px-3 py-2 text-sm focus:ring-2 focus:ring-green-600"
          (change)="onDateChange($any($event.target).value)" />
      </div>

      <!-- 🔁 Boutons à droite -->
      <div class="flex items-center gap-3 justify-end w-full sm:w-auto">
        <!-- Bouton Réinitialiser -->
        <button
          class="flex items-center justify-center w-10 h-10 rounded-full text-gray-600 hover:text-green-700 hover:bg-gray-100 transition"
          (click)="clearFilters()"
          title="Réinitialiser les filtres">
          <i class="fa-solid fa-rotate-right text-lg"></i>
        </button>

        <!-- Bouton Ajouter -->
        <button
          class="flex items-center justify-center w-10 h-10 rounded-full bg-green-600 hover:bg-green-700 text-white shadow-sm transition"
          (click)="openAddForm()"
          title="Ajouter un texte juridique">
          <i class="fa-solid fa-circle-plus text-lg"></i>
        </button>
      </div>
    </div>

    <!-- 📋 Tableau -->
    <div class="overflow-x-auto bg-white mt-6">
      <table class="min-w-full text-sm">
        <thead>
          <tr
            class="text-left text-gray-500 border-b border-gray-100 bg-gray-50/70">
            <th class="px-6 py-3 font-semibold">TITRE</th>
            <th class="px-6 py-3 font-semibold">TYPE</th>
            <th class="px-6 py-3 font-semibold">RÉFÉRENCE</th>
            <th class="px-6 py-3 font-semibold">DATE</th>
            <th class="px-6 py-3 font-semibold">STATUT</th>
            <th class="px-6 py-3 font-semibold">PORTÉE</th>
            <th class="px-6 py-3 font-semibold text-center">ACTIONS</th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let t of paged()"
            class="border-b border-gray-50 hover:bg-gray-50/60 transition">

            <td class="px-6 py-3 font-medium text-gray-900">{{ t.titre }}</td>
            <td class="px-6 py-3 text-gray-700">{{ t.type }}</td>
            <td class="px-6 py-3">{{ t.reference }}</td>
            <td class="px-6 py-3">{{ t.datePublication }}</td>

            <td class="px-6 py-3">
              <span
                [ngClass]="{
                  'bg-green-100 text-green-700': t.statut==='En vigueur',
                  'bg-red-100 text-red-700': t.statut==='Abrogé',
                  'bg-yellow-100 text-yellow-700': t.statut==='Projet'
                }"
                class="px-2.5 py-1 rounded-full text-xs font-semibold inline-flex items-center">
                {{ t.statut }}
              </span>
            </td>

            <td class="px-6 py-3">
              <span
                class="px-2.5 py-1 rounded-full text-xs font-semibold"
                [ngClass]="{
                  'bg-yellow-100 text-yellow-800': t.portee==='Nationale',
                  'bg-blue-100 text-blue-800': t.portee==='MESRS',
                  'bg-purple-100 text-purple-800': t.portee==='Régionale'
                }">
                {{ t.portee }}
              </span>
            </td>

            <td class="px-6 py-3 text-center">
              <div class="flex items-center justify-center gap-3">
                <a
                  [routerLink]="['/textes', t.id]"
                  class="text-green-700 font-medium hover:text-green-800 transition flex items-center gap-1"
                  title="Voir détails">
                  <i class="fa-solid fa-eye"></i>
                </a>

                <button
                  class="text-blue-600 hover:text-blue-800 transition"
                  title="Modifier"
                  (click)="edit(t.id)">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>

                <button
                  class="text-gray-500 hover:text-red-600 transition"
                  title="Supprimer"
                  (click)="remove(t.id)">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </div>
            </td>
          </tr>

          <tr *ngIf="paged().length===0">
            <td colspan="7"
              class="px-6 py-8 text-center text-gray-500">Aucun résultat</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 📄 Pagination -->
    <div
      class="flex flex-col sm:flex-row items-center justify-between px-6 py-4 bg-gray-50/60 border-t border-gray-100">
      <div class="text-xs text-gray-500 mb-2 sm:mb-0">
        Affichage {{ displayStart() }}–{{ displayEnd() }} sur {{ filtered().length }}
      </div>

      <div class="flex items-center gap-1">
        <button
          class="h-8 w-8 rounded border border-gray-200 disabled:opacity-50 hover:bg-gray-100 transition"
          (click)="pagePrev()"
          [disabled]="page()===1">‹</button>

        <ng-container *ngFor="let p of [].constructor(totalPages()); let i = index">
          <button
            class="h-8 w-8 rounded border text-sm transition"
            [ngClass]="{
              'bg-green-600 text-white border-green-600': (i+1)===page(),
              'border-gray-200 hover:bg-gray-100': (i+1)!==page()
            }"
            (click)="pageGo(i+1)">
            {{ i+1 }}
          </button>
        </ng-container>

        <button
          class="h-8 w-8 rounded border border-gray-200 disabled:opacity-50 hover:bg-gray-100 transition"
          (click)="pageNext()"
          [disabled]="page()===totalPages()">›</button>
      </div>
    </div>
  </div>
</div>
