<app-sidebar></app-sidebar>
<app-header [title]="'Nouveau texte'" [withSidebar]="true"></app-header>

<div class="lg:ml-80 pt-28 px-6 pb-6">
  <!-- 🌿 Conteneur animé -->
  <div
    class="bg-white border border-gray-200 rounded-2xl shadow-lg p-6 max-w-4xl mx-auto transform transition-all duration-500 ease-out animate-fade-in">

    <!-- 🔙 Bouton retour -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-lg font-semibold text-gray-800">Ajouter un texte réglementaire</h2>
      <a
        routerLink="/textes"
        class="flex items-center gap-2 bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full shadow-sm transition">
        <i class="fa-solid fa-arrow-left text-gray-500"></i>
        Retour
      </a>
    </div>

    <!-- 📝 Formulaire -->
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="grid grid-cols-1 md:grid-cols-2 gap-4 animate-slide-up">

      <label class="block">
        <span class="text-sm text-gray-700">Titre</span>
        <input
          type="text"
          formControlName="titre"
          class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
      </label>

      <label class="block">
        <span class="text-sm text-gray-700">Type</span>
        <select formControlName="type" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600">
          <option value="">— Sélectionner —</option>
          <option>Loi</option>
          <option>Décret</option>
          <option>Arrêté</option>
          <option>Circulaire</option>
          <option>Note</option>
          <option>Ordonnance</option>
          <option>Instruction</option>
          <option>Décision</option>
          <option>Règlement</option>
          <option>Directive</option>
          <option>Autre</option>
        </select>
      </label>

      <label class="block">
        <span class="text-sm text-gray-700">Référence</span>
        <input
          type="text"
          formControlName="reference"
          class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
      </label>

      <label class="block">
        <span class="text-sm text-gray-700">Date de publication</span>
        <input
          type="date"
          formControlName="datePublication"
          class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
      </label>

      <label class="block">
        <span class="text-sm text-gray-700">Statut</span>
        <select
          formControlName="statut"
          class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600">
          <option>En vigueur</option>
          <option>Abrogé</option>
          <option>Projet</option>
        </select>
      </label>

      <label class="block">
        <span class="text-sm text-gray-700">Portée</span>
        <select
          formControlName="portee"
          class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-600">
          <option>Nationale</option>
          <option>MESRS</option>
          <option>Régionale</option>
        </select>
      </label>

      <label class="block md:col-span-2">
        <span class="text-sm text-gray-700">Importer un fichier PDF (optionnel)</span>
        <div class="mt-1 flex items-center gap-3">
          <input type="file" accept="application/pdf" (change)="onFileSelected($event)"
                 class="block w-full text-sm text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-medium file:bg-green-50 file:text-green-700 hover:file:bg-green-100" />
          <span class="text-xs text-gray-500" *ngIf="selectedFileName">{{ selectedFileName }}</span>
        </div>
      </label>

      <!-- 🧩 Boutons -->
      <div class="md:col-span-2 flex justify-end gap-3 mt-4">
        <a
          routerLink="/textes"
          class="px-4 py-2 rounded-full border border-gray-200 text-gray-700 hover:bg-gray-50 transition">
          Annuler
        </a>
        <button
          type="submit"
          [disabled]="submitting || form.invalid"
          class="px-5 py-2 rounded-full bg-green-600 text-white hover:bg-green-700 shadow-md hover:shadow-lg transition disabled:opacity-50">
          Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>
