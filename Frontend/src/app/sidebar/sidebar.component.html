<aside
  class="h-[calc(100vh-2rem)] w-72 
         bg-gradient-to-b from-white via-emerald-50/50 to-teal-50/30
         rounded-2xl shadow-2xl 
         fixed left-4 top-4 z-40 flex flex-col overflow-hidden 
         transition-all duration-500
         border border-emerald-100">

  <!-- Background decorations -->

    <div class="absolute top-1/3 -right-10 w-32 h-32 bg-teal-300/25 rounded-full blur-3xl"></div>
    <div class="absolute bottom-20 -left-10 w-36 h-36 bg-green-200/30 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-48 h-48 bg-emerald-200/20 rounded-full blur-3xl"></div>
    
    <!-- Grid pattern - vert -->

    <!-- Logo container with glow -->
    <div class="relative group">
      <div class="absolute inset-0 bg-gradient-to-br from-emerald-300/40 to-teal-300/40 rounded-full blur-2xl 
                  scale-75 group-hover:scale-100 transition-transform duration-500"></div>
      <img
        src="assets/images/logo-removebg-preview.png"
        alt="Logo MESRS"
        class="relative w-24 h-24 mb-3 drop-shadow-xl object-contain
               transition-transform duration-500 group-hover:scale-105"
      />

    <h2 class="text-emerald-800 font-bold text-lg tracking-wide">MESRS</h2>
    <p class="text-emerald-600/80 text-xs font-medium tracking-wider uppercase mt-1">Inspection Générale</p>

    <div class="w-16 h-0.5 bg-gradient-to-r from-transparent via-emerald-400 to-transparent mt-4"></div>
  </div>

    <p class="text-xs text-emerald-600 uppercase tracking-wider font-semibold px-3 pt-2 pb-3">Menu principal</p>
    
    <a routerLink="/dashboard" routerLinkActive="active-link"

      <div class="sidebar-icon">
        <lucide-icon name="home" class="w-5 h-5"></lucide-icon>
      </div>
      <span class="sidebar-text">Dashboard</span>
      <div class="sidebar-indicator"></div>
    </a>

    <a routerLink="/textes" routerLinkActive="active-link" 
       class="sidebar-item group">
      <div class="sidebar-icon">
        <lucide-icon name="scale" class="w-5 h-5"></lucide-icon>
      </div>
      <span class="sidebar-text">Textes réglementaires</span>
      <div class="sidebar-indicator"></div>
    </a>

    <a routerLink="/etablissements" routerLinkActive="active-link"

      </div>
      <span class="sidebar-text">Établissements</span>
      <div class="sidebar-indicator"></div>

    <a routerLink="/formations" routerLinkActive="active-link"

      </div>
      <span class="sidebar-text">Formations</span>
      <div class="sidebar-indicator"></div>
    </a>

    <a routerLink="/ressources" routerLinkActive="active-link" 
       class="sidebar-item group">
      <div class="sidebar-icon">
        <lucide-icon name="users" class="w-5 h-5"></lucide-icon>
      </div>
      <span class="sidebar-text">Ressources humaines</span>
      <div class="sidebar-indicator"></div>
    </a>

    <a routerLink="/finances" routerLinkActive="active-link" 
       class="sidebar-item group">

        <lucide-icon name="coins" class="w-5 h-5"></lucide-icon>
      </div>
      <span class="sidebar-text">Finances</span>
      <div class="sidebar-indicator"></div>
    </a>

    <a routerLink="/recherche" routerLinkActive="active-link" 
       class="sidebar-item group">
      <div class="sidebar-icon">
        <lucide-icon name="flask-conical" class="w-5 h-5"></lucide-icon>
      </div>
      <span class="sidebar-text">Recherche</span>
      <div class="sidebar-indicator"></div>
    </a>

    <a routerLink="/indicateurs" routerLinkActive="active-link" 
       class="sidebar-item group">
      <div class="sidebar-icon">
        <lucide-icon name="bar-chart-3" class="w-5 h-5"></lucide-icon>
      </div>
      <span class="sidebar-text">Indicateurs</span>
      <div class="sidebar-indicator"></div>
    </a>

    <a *ngIf="isIG" routerLink="/inspection" routerLinkActive="active-link" 
       class="sidebar-item group">
      <div class="sidebar-icon">
        <lucide-icon name="clipboard-list" class="w-5 h-5"></lucide-icon>
      </div>
      <span class="sidebar-text">Inspection</span>
      <div class="sidebar-indicator"></div>
    </a>

    <a *ngIf="isSousInspecteur" routerLink="/mes-missions" routerLinkActive="active-link" 
       class="sidebar-item group">
      <div class="sidebar-icon">
        <lucide-icon name="clipboard-check" class="w-5 h-5"></lucide-icon>
      </div>
      <span class="sidebar-text">Mes missions</span>
      <span *ngIf="unreadCount > 0"
            class="ml-auto bg-gradient-to-r from-red-500 to-pink-500 text-white text-[10px] font-bold leading-3 px-1.5 py-0.5 rounded-full shadow-lg">
        {{ unreadCount }}
      </span>
      <div class="sidebar-indicator"></div>
    </a>

    <a routerLink="/notifications" routerLinkActive="active-link" 
       class="sidebar-item group">
      <div class="sidebar-icon">
        <lucide-icon name="bell" class="w-5 h-5"></lucide-icon>
      </div>
      <span class="sidebar-text">Notifications</span>
      <span *ngIf="unreadCount > 0"
            class="ml-auto bg-gradient-to-r from-red-500 to-pink-500 text-white text-[10px] font-bold leading-3 px-1.5 py-0.5 rounded-full shadow-lg">
        {{ unreadCount }}
      </span>
      <div class="sidebar-indicator"></div>
    </a>

    <a *ngIf="isIG" routerLink="/users" routerLinkActive="active-link" 
       class="sidebar-item group">
      <div class="sidebar-icon">
        <lucide-icon name="user-cog" class="w-5 h-5"></lucide-icon>
      </div>
      <span class="sidebar-text">Utilisateurs</span>
      <div class="sidebar-indicator"></div>
    </a>
