<!-- Page de connexion moderne avec animation premium -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto py-6    sm:py-8"
  [attr.dir]="langue === 'ar' ? 'rtl' : 'ltr'"
  
>
  <!-- Background avec image et overlay -->
  <div class="absolute inset-0 z-0 overflow-hidden">
    <img 
      src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80" 
      alt="Background"
      class="w-full h-full object-cover scale-105 animate-slow-zoom"
    >
    <div class="absolute inset-0 bg-gradient-to-br from-slate-900/90 via-emerald-900/85 to-teal-900/90"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent"></div>
  </div>

  <!-- Particules décoratives -->
  <div class="absolute inset-0 z-[1] pointer-events-none overflow-hidden">
    <div class="absolute top-[15%] left-[10%] w-2 h-2 bg-emerald-400/50 rounded-full animate-float"></div>
    <div class="absolute top-[25%] right-[15%] w-3 h-3 bg-teal-300/40 rounded-full animate-float delay-300"></div>
    <div class="absolute bottom-[30%] left-[20%] w-2 h-2 bg-white/30 rounded-full animate-float delay-500"></div>
    <div class="absolute top-[50%] right-[10%] w-4 h-4 bg-emerald-300/20 rounded-full animate-float-slow"></div>
    <div class="absolute bottom-[20%] right-[25%] w-2 h-2 bg-teal-400/40 rounded-full animate-float delay-700"></div>
    
    <!-- Cercles orbitaux -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] border border-white/5 rounded-full animate-rotate-slow"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] border border-emerald-400/10 rounded-full animate-rotate-slow" style="animation-direction: reverse;"></div>
  </div>

  <!-- Carte de connexion -->
  <div class="relative z-10 w-full max-w-md mx-3 sm:mx-4 my-auto animate-slide-left">
    
    <!-- Carte principale glassmorphism -->
    <div class="relative bg-white/10 backdrop-blur-xl rounded-2xl sm:rounded-[2rem] 
                shadow-[0_25px_60px_-15px_rgba(0,0,0,0.4)] 
                border border-white/20 
                p-5 sm:p-8 md:p-10
                overflow-hidden
                hover:bg-white/15 hover:shadow-[0_30px_70px_-15px_rgba(16,185,129,0.25)] 
                transition-all duration-500">
      
      <!-- Accent décoratif top -->
      <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-20 h-1 bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-500 rounded-full"></div>
      
      <!-- Halos décoratifs animés -->
      <div class="pointer-events-none absolute -top-20 -right-20 w-48 h-48 rounded-full bg-gradient-to-br from-emerald-300/30 to-teal-300/20 blur-3xl animate-pulse-slow"></div>
      <div class="pointer-events-none absolute -bottom-24 -left-16 w-52 h-52 rounded-full bg-gradient-to-tr from-teal-400/20 to-emerald-400/20 blur-3xl animate-pulse-slow delay-500"></div>

      <!-- Logo + titre -->
      <div class="relative flex flex-col items-center text-center mb-4 sm:mb-6">
        
        <!-- Logo avec effet glow -->
        <div class="relative mb-3 sm:mb-4 group">
          <div class="absolute inset-0 blur-xl sm:blur-2xl bg-gradient-to-br from-emerald-400/40 to-teal-400/40 rounded-full -z-10 scale-110 sm:scale-125 
                      group-hover:scale-[1.3] sm:group-hover:scale-[1.5] transition-transform duration-500 animate-pulse-glow"></div>
          <img
            src="assets/images/logo-removebg-preview.png"
            alt="Logo MESRS"
            class="h-16 w-16 sm:h-24 sm:w-24 md:h-28 md:w-28 drop-shadow-xl 
                   hover:scale-105 transition-all duration-300 cursor-pointer"
          />
        </div>

        <!-- Badge -->
        <div class="inline-flex items-center gap-1.5 sm:gap-2 px-3 py-1.5 sm:px-4 sm:py-2 rounded-full
                    bg-white/10 backdrop-blur-sm
                    border border-white/20 mb-2 sm:mb-3
                    animate-fade-up delay-200 opacity-0"
             style="animation-fill-mode: forwards;">
          <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>
          <span class="text-emerald-300 text-xs font-bold tracking-wider uppercase">
            {{ langue === 'ar' ? 'تسجيل الدخول' : 'Connexion sécurisée' }}
          </span>
        </div>
        
        <p class="text-sm text-white/70 max-w-xs animate-fade-up delay-300 opacity-0" style="animation-fill-mode: forwards;">
          {{
            langue === 'ar'
              ? 'الرجاء إدخال معلومات حسابكم للمتابعة.'
              : 'Veuillez saisir vos identifiants pour continuer.'
          }}
        </p>
      </div>

      <!-- Formulaire -->
      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        class="relative space-y-3 sm:space-y-4"
      >
        <!-- Champ utilisateur -->
        <div class="animate-fade-up delay-400 opacity-0" style="animation-fill-mode: forwards;">
          <label class="block text-sm font-semibold text-white/90 mb-2">
            {{ langue === 'ar' ? 'اسم المستخدم' : 'Utilisateur' }}
          </label>
          <div class="relative group">
            <input
              type="text"
              formControlName="username"
              [placeholder]="langue === 'ar' ? 'اكتب اسم المستخدم' : 'Entrez votre identifiant'"
              class="w-full rounded-xl border-2 border-white/30 bg-white/5
                     px-3 py-3 sm:px-4 sm:py-3.5 pr-10 sm:pr-12 
                     text-sm sm:text-base text-white
                     placeholder-white/50
                     focus:border-emerald-400 focus:outline-none focus:bg-white/10
                     focus:ring-4 focus:ring-emerald-500/20
                     hover:border-white/50 hover:bg-white/10
                     transition-all duration-300"
            />
            <span class="pointer-events-none absolute inset-y-0 end-4 flex items-center text-white/50 
                         group-focus-within:text-emerald-400 transition-colors duration-300">
              <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Champ mot de passe -->
        <div class="animate-fade-up delay-500 opacity-0" style="animation-fill-mode: forwards;">
          <label class="block text-sm font-semibold text-white/90 mb-2">
            {{ langue === 'ar' ? 'كلمة المرور' : 'Mot de passe' }}
          </label>
          <div class="relative group">
            <input
              type="password"
              formControlName="password"
              [placeholder]="langue === 'ar' ? 'اكتب كلمة المرور' : 'Entrez votre mot de passe'"
              class="w-full rounded-xl border-2 border-white/30 bg-white/5
                     px-3 py-3 sm:px-4 sm:py-3.5 pr-10 sm:pr-12 
                     text-sm sm:text-base text-white
                     placeholder-white/50
                     focus:border-emerald-400 focus:outline-none focus:bg-white/10
                     focus:ring-4 focus:ring-emerald-500/20
                     hover:border-white/50 hover:bg-white/10
                     transition-all duration-300"
            />
            <span class="pointer-events-none absolute inset-y-0 end-4 flex items-center text-white/50 
                         group-focus-within:text-emerald-400 transition-colors duration-300">
              <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Bouton de connexion -->
        <div class="pt-2 animate-fade-up delay-700 opacity-0" style="animation-fill-mode: forwards;">
          <button
            type="submit"
            [disabled]="submitting || form.invalid"
            class="group relative w-full bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500
                   text-white rounded-xl py-4 font-bold text-base
                   shadow-[0_10px_40px_-10px_rgba(16,185,129,0.5)]
                   hover:shadow-[0_15px_50px_-10px_rgba(16,185,129,0.6)]
                   disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-none disabled:hover:translate-y-0
                   transform transition-all duration-300 
                   hover:-translate-y-1 hover:scale-[1.02]
                   overflow-hidden"
          >
            <!-- Animated background on hover -->
            <div class="absolute inset-0 bg-gradient-to-r from-teal-500 via-emerald-500 to-emerald-600 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            <!-- Shimmer effect -->
            <div class="absolute inset-0 animate-shimmer opacity-20"></div>
            <!-- Glow ring -->
            <div class="absolute -inset-1 bg-gradient-to-r from-emerald-400 to-teal-400 rounded-xl blur opacity-30 group-hover:opacity-50 transition-opacity duration-500 -z-10"></div>
            
            <span class="relative z-10 flex items-center justify-center gap-2">
              {{
                submitting
                  ? (langue === 'ar' ? '...جارٍ تسجيل الدخول' : 'Connexion en cours...')
                  : (langue === 'ar' ? 'تسجيل الدخول' : 'Se connecter')
              }}
              <svg *ngIf="!submitting" class="w-5 h-5 group-hover:translate-x-1 transition-transform duration-300" 
                   fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
              <svg *ngIf="submitting" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </span>
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
